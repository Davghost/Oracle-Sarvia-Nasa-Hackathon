<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Sarvia{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='vendor/leaflet/leaflet.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
<div id="banner">NISAR data are provisional and may be reprocessed. <span id="mock-flag" hidden>Mock data, not real results</span></div>
{% block content %}{% endblock %}
<script src="{{ url_for('static', filename='vendor/leaflet/leaflet.js') }}"></script>
<script>window.SARVIA_MAP_CONFIG = {{ map_config|tojson }}; window.SARVIA_ROUTES_URL = {{ url_for('routes')|tojson }};</script>
<script src="{{ url_for('static', filename='core.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
