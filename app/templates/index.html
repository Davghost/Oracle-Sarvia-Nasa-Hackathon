<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flood view with NISAR radar</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div id="banner">NISAR data are <b>provisional</b> and may be reprocessed. <span id="mock-flag" hidden>MOCK DATA: not real results.</span></div>
<div id="map"></div>
<aside id="panel">
  <h1 id="title">Loading…</h1>
  <label for="slider">Before <span>◀ ▶</span> During</label>
  <input id="slider" type="range" min="0" max="100" value="100">
  <dl id="numbers"></dl>
  <h2>Limitations</h2>
  <ul id="limits"></ul>
</aside>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
